name: 每日签到（提交 + 自动部署）

on:
  # 每天 UTC 22:00 = 北京时间 06:00
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: daily-activity
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    name: 更新数据并提交
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 更新 GitHub 贡献数据
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-github-contributions.mjs

      - name: 记录站点每日状态
        run: node scripts/daily-log.mjs

      - name: 提交并推送
        id: commit
        run: |
          # 使用博主本人身份提交，确保计入 GitHub 贡献墙（机器人邮箱不会被计入）
          git config user.name "Eric Bai"
          git config user.email "3200769991@qq.com"
          git add src/data/github-contributions.json docs/site-uptime.md
          if git diff --cached --quiet; then
            echo "没有需要提交的变更"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: 每日签到 $(TZ=Asia/Shanghai date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 本次提交内容
        run: |
          git log -1 --stat --format='%h %s'

  deploy:
    name: 构建并部署
    needs: daily
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
