# ============================================================
# bihrys.com 直连源站后的缓存策略
# 部署位置：/www/server/panel/vhost/nginx/extension/bihrsy.com/
# 说明：宝塔的「扩展配置」会被 include 到 server 块内，且位置靠前，
#       所以这里的正则 location 会先于面板默认的 12h 规则命中。
# ============================================================

# 默认：HTML / JSON 等回到浏览器后每次回源校验（304 很快），
# 避免新文章要等浏览器缓存过期才看得到。
expires -1;

# Astro 构建产物：文件名带内容 hash，可永久缓存
location ^~ /_astro/ {
    expires 30d;
    access_log off;
}

# 背景音乐：文件名带版本号（换歌时改文件名即可）
location ^~ /music/ {
    expires 30d;
    access_log off;
}

# 图片与字体
location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|woff|woff2|ttf|otf)$ {
    expires 30d;
    access_log off;
}

# JS / CSS 兜底（覆盖面板默认的 12h）
location ~* \.(js|css)$ {
    expires 30d;
    access_log off;
}
